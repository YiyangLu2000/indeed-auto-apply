[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indeed-auto-apply"
version = "0.1.0"
description = "Minimal end-to-end Indeed auto-apply backend module"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.47.0",
    "cryptography==43.0.1",
    "typer==0.12.5",
    "click==8.1.7",  # typer 0.12.x breaks with click >= 8.2
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
